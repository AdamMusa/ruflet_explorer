# Keep this identity aligned with the existing Ruflet Explorer App Store and
# Play Store listing. Changing the bundle identifier creates a different app.
app:
  app_name: Ruflet Explorer
  package_name: rufletexplorer
  organization: com.izeesoft
  bundle_identifier: com.izeesoft.rufletexplorer
  android_application_id: com.izeesoft.rufletexplorer
  ios_bundle_identifier: com.izeesoft.rufletexplorer
  version: 1.0.1+6
  description: Ruflet Explorer connection client.

services:
  - camera:
      description: Camera access is required to scan Ruflet QR connection codes.
  - microphone:
      description: Microphone access is required for audio recording.
  - location:
      description: Location access may be requested by connected experiences that use location-aware components.
  - motion:
      description: Motion access is required for barometer readings.
