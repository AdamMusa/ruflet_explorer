app:
  name: Ruflet Explorer
  package_name: rufletexplorer
  organization: com.izeesoft
  version: 1.0.1+8
  description: The app preview for Ruflet.
  backend_url: ""

# Ruflet Explorer must be able to render every supported extension used by a
# connected Ruflet application.
extensions:
  - audio
  - audio_recorder
  - camera
  - charts
  - code_editor
  - color_pickers
  - datatable2
  - flashlight
  - geolocator
  - lottie
  - map
  - permission_handler
  - qrcode_scanner
  - rive
  - secure_storage
  - spinkit
  - video
  - webview

assets:
  dir: assets

# Each platform declares its own splash screen and launcher icon. Android draws
# its own splash from API 31 and its own adaptive icon from API 26, so both need
# explicit configuration or the OS falls back to its defaults.
android:
  splash_screen: assets/and_splash.png
  splash_color: "#FFFFFF"
  splash_dark_color: "#0B0B0B"
  splash_fullscreen: true
  splash_android_12_icon_background_color: "#FFFFFF"
  splash_android_12_icon_background_color_dark: "#0B0B0B"
  icon_launcher: assets/icon.png
  icon_background: "#FFFFFF"
  theme_color: "#6750A4"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon.png
  min_sdk: 21

ios:
  # Explorer hosts remote RufletApp sessions even though its own Ruby is in-process.
  local_network: true
  local_network_usage_description: Connect to the Ruflet server selected by address or QR code.
  team_id: 7Z35W53SMQ
  splash_screen: assets/splash.png
  splash_color: "#FFFFFF"
  splash_dark_color: "#0B0B0B"
  icon_launcher: assets/icon.png
  remove_alpha: true

web:
  splash_screen: assets/splash.png
  splash_color: "#FFFFFF"
  splash_dark_color: "#0B0B0B"
  image_mode: center
  icon_launcher: assets/icon.png
  icon_background: "#FFFFFF"
  theme_color: "#6750A4"

macos:
  local_network: true
  local_network_usage_description: Connect to the Ruflet server selected by address or QR code.
  icon_launcher: assets/icon.png

windows:
  icon_launcher: assets/icon.png
  icon_size: 256

# Flutter's Linux runner has no icon or splash mechanism, so nothing is
# generated from this section yet; the build reports it rather than ignoring it.
linux:
  icon_launcher: assets/icon.png
